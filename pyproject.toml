[project]
name = "tracelite"
version = "0.1.0"
description = "A distributed tracing system built from scratch — zero dependencies, W3C compliant"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Haji Rufai"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
